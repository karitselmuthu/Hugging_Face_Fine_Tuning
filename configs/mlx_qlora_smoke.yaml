# Mac-native QLoRA: MLX-LM applies LoRA to this 4-bit quantized base model.
model: models/smollm2-135m-mlx-4bit
train: true
data: data/mlx-qlora-smoke
adapter_path: models/smollm-horoscope-mlx-qlora-smoke-config
fine_tune_type: lora
mask_prompt: true
batch_size: 1
iters: 2
num_layers: 16
learning_rate: 0.0002
max_seq_length: 256
steps_per_report: 1
steps_per_eval: 2
val_batches: 2
save_every: 2
seed: 42
