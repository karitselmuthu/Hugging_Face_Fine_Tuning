# One pass over 512 prepared examples, using the Mac-native 4-bit model.
model: models/smollm2-135m-mlx-4bit
train: true
data: data/mlx-qlora-512
adapter_path: models/smollm-horoscope-mlx-qlora-512
fine_tune_type: lora
mask_prompt: true
batch_size: 1
iters: 512
num_layers: 16
learning_rate: 0.0002
max_seq_length: 256
steps_per_report: 32
steps_per_eval: 128
val_batches: 64
save_every: 128
seed: 42
